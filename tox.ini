[tox]
skip_missing_interpreters = False

envlist =
    py39-{docs,flake8},
    py{38,39,310,311,312}-{django40,django41,django42}-{pg,sqlite},
    py{310,311,312}-django50-{pg,sqlite},
    py{310,311,312,313}-django51-{pg,sqlite},
    py{312,313}-django60-{pg,sqlite},
    py{312,313}-djangolatest-{pg,sqlite},

[testenv]
deps =
    -crequirements.txt
    cryptography
    pytest-django
    pytest
    coverage

    psycopg2-binary

    django40: Django>=4.0,<4.1
    django41: Django>=4.1,<4.2
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django60: Django>=6.0,<6.1
    djangolatest: Django>=6.0

setenv =
    sqlite: DJANGO_SETTINGS_MODULE = fernet_fields.test.settings.sqlite
    pg: DJANGO_SETTINGS_MODULE = fernet_fields.test.settings.pg

error_filters =
    py{311,312}-django40: -Wdefault:"'cgi' is deprecated and slated for removal in Python 3.13":DeprecationWarning:django.http.request
    # cryptography still supports 3.8 but warns on import, and -Werror turns
    # that into a collection error. The category is spelled as its base class
    # on purpose: naming CryptographyDeprecationWarning would import
    # cryptography to resolve it, which is what raises the warning.
    py38: -Wdefault:"Python 3.8 is no longer supported by the Python core team":UserWarning

commands =
    coverage run -a runtests.py -Werror {[testenv]error_filters} fernet_fields/test --tb short

[testenv:py39-flake8]
deps = flake8
changedir = {toxinidir}
commands = flake8 .

[testenv:py39-docs]
deps = Sphinx
changedir = {toxinidir}/doc
commands =
    sphinx-build -aEWq -b html . _build/html

[flake8]
exclude = .tox,.git,__pycache__,doc/conf.py
