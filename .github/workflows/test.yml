name: test

on:
  push:
    branches: [main-archa, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          # setup-python ships no 3.8 build for ubuntu-24.04 (= ubuntu-latest).
          - python-version: '3.8'
            os: ubuntu-22.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          # fernet_fields/test/settings/pg.py connects without a password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      # -f selects every env in the tox envlist carrying this python factor,
      # so the matrix in tox.ini stays the single source of truth (this also
      # picks up the py39 flake8 and docs envs on the 3.9 job).
      - name: Run tox
        run: tox -f "py${PYTHON_VERSION//./}"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
